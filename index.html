```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connection Error</title>

<style>

body{
margin:0;
font-family:Arial;
background:#111;
color:white;
overflow:hidden;
}

#errorPage,
#loginPage,
#chatPage{
width:100%;
height:100vh;
}

#errorPage{
display:flex;
justify-content:center;
align-items:center;
text-align:center;
}

.error-code{
font-size:120px;
font-weight:bold;
color:#999;
}

.error-title{
font-size:30px;
margin-top:10px;
}

.error-text{
margin-top:20px;
color:#aaa;
}

.more-link{
margin-top:30px;
color:#666;
cursor:pointer;
}

#loginPage{
display:none;
justify-content:center;
align-items:center;
background:#0f172a;
}

.login-box{
width:320px;
background:#111827;
padding:30px;
border-radius:16px;
}

.input{
width:100%;
padding:14px;
margin-bottom:15px;
border:none;
background:#1e293b;
border-radius:10px;
color:white;
}

.login-btn,
.send-btn{
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
cursor:pointer;
}

#chatPage{
display:none;
background:#0f172a;
}

.topbar{
height:70px;
background:#111827;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
}

.logout-btn{
background:red;
border:none;
padding:10px 15px;
color:white;
border-radius:10px;
cursor:pointer;
}

.messages{
height:calc(100vh - 150px);
overflow-y:auto;
padding:20px;
}

.message{
background:#1e293b;
padding:12px;
margin-bottom:10px;
border-radius:10px;
max-width:70%;
}

.input-area{
height:80px;
display:flex;
padding:10px;
gap:10px;
}

.message-input{
flex:1;
padding:14px;
border:none;
background:#1e293b;
border-radius:10px;
color:white;
}

</style>
</head>

<body>

<div id="errorPage">

<div>

<div class="error-code">
503
</div>

<div class="error-title">
Service Temporarily Unavailable
</div>

<div class="error-text">
ERR_CONNECTION_CLOSED
</div>

<div class="more-link" id="moreBtn">
More Details
</div>

</div>

</div>

<div id="loginPage">

<div class="login-box">

<h2>Secure Access</h2>

<br>

<input type="email" id="email" class="input" placeholder="Email">

<input type="password" id="password" class="input" placeholder="Password">

<button class="login-btn" id="loginBtn">
Enter
</button>

</div>

</div>

<div id="chatPage">

<div class="topbar">

<h3>
Private Chat
</h3>

<button class="logout-btn" id="logoutBtn">
Logout
</button>

</div>

<div class="messages" id="messages"></div>

<div class="input-area">

<input type="text" id="messageInput" class="message-input" placeholder="Type message">

<button class="send-btn" id="sendBtn">
Send
</button>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

window.addEventListener(
"load",
function(){

const SUPABASE_URL =
"https://kumqnjqjrtkyfwuvhpqq.supabase.co";

const SUPABASE_KEY =
"YOUR_ANON_KEY";

const supabase =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const errorPage =
document.getElementById("errorPage");

const loginPage =
document.getElementById("loginPage");

const chatPage =
document.getElementById("chatPage");

document.getElementById(
"moreBtn"
).onclick=function(){

errorPage.style.display="none";

loginPage.style.display="flex";

};

document.getElementById(
"loginBtn"
).onclick=async function(){

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

const { error } =
await supabase.auth.signInWithPassword({

email:email,
password:password

});

if(error){

alert(error.message);
return;

}

loginPage.style.display="none";

chatPage.style.display="block";

loadMessages();

};

document.getElementById(
"logoutBtn"
).onclick=async function(){

await supabase.auth.signOut();

location.reload();

};

document.getElementById(
"sendBtn"
).onclick=sendMessage;

async function sendMessage(){

const input =
document.getElementById(
"messageInput"
);

const text =
input.value.trim();

if(!text) return;

const {
data:{user}
} = await supabase.auth.getUser();

await supabase
.from("message")
.insert([{

sender:user.email,
encrypted:{
text:text
}

}]);

input.value="";

}

async function loadMessages(){

const box =
document.getElementById(
"messages"
);

async function refresh(){

const { data } =
await supabase
.from("message")
.select("*")
.order("id",{ascending:true});

box.innerHTML="";

for(const item of data){

const div =
document.createElement("div");

div.className="message";

div.innerHTML=`

<b>${item.sender}</b>
<br><br>
${item.encrypted.text}

`;

box.appendChild(div);

}

box.scrollTop=
box.scrollHeight;

}

refresh();

supabase
.channel("chat")
.on(
"postgres_changes",
{
event:"*",
schema:"public",
table:"message"
},
()=>{
refresh();
}
)
.subscribe();

}

}
);

</script>

</body>
</html>
