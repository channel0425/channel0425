<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Service Temporarily Unavailable</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#111;
color:white;
overflow:hidden;
}

/* ERROR PAGE */

#errorPage{
width:100%;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
}

.error-box{
max-width:600px;
}

.error-code{
font-size:120px;
font-weight:bold;
color:#9ca3af;
}

.error-title{
font-size:32px;
margin-top:10px;
color:#d1d5db;
}

.error-text{
margin-top:20px;
line-height:1.7;
color:#9ca3af;
}

.more-link{
margin-top:35px;
display:inline-block;
font-size:13px;
color:#6b7280;
cursor:pointer;
}

.more-link:hover{
color:#d1d5db;
}

/* LOGIN PAGE */

#loginPage{
display:none;
width:100%;
height:100vh;
justify-content:center;
align-items:center;
background:#0f172a;
}

.login-box{
width:340px;
background:#111827;
padding:30px;
border-radius:18px;
}

.login-title{
text-align:center;
margin-bottom:25px;
}

.input{
width:100%;
padding:14px;
margin-bottom:15px;
border:none;
outline:none;
background:#1e293b;
border-radius:10px;
color:white;
}

.login-btn{
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
font-weight:bold;
cursor:pointer;
}

/* CHAT PAGE */

#chatPage{
display:none;
width:100%;
height:100vh;
background:#0f172a;
}

.topbar{
height:70px;
background:#111827;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
border-bottom:1px solid #1e293b;
}

.logout-btn{
background:#ef4444;
border:none;
padding:10px 15px;
color:white;
border-radius:10px;
cursor:pointer;
}

.messages{
height:calc(100vh - 150px);
overflow-y:auto;
padding:20px;
}

.message{
background:#1e293b;
padding:12px;
margin-bottom:12px;
border-radius:12px;
max-width:70%;
line-height:1.6;
}

.input-area{
height:80px;
display:flex;
gap:10px;
padding:15px;
border-top:1px solid #1e293b;
}

.message-input{
flex:1;
border:none;
outline:none;
background:#1e293b;
padding:14px;
border-radius:12px;
color:white;
}

.send-btn{
width:100px;
border:none;
border-radius:12px;
background:#2563eb;
color:white;
font-weight:bold;
cursor:pointer;
}

</style>

</head>

<body>

<!-- ERROR PAGE -->

<div id="errorPage">

<div class="error-box">

<div class="error-code">
503
</div>

<div class="error-title">
Service Temporarily Unavailable
</div>

<div class="error-text">

The server is temporarily unable to handle your request.<br><br>

ERR_CONNECTION_CLOSED

</div>

<div class="more-link" id="moreBtn">
More Details
</div>

</div>

</div>

<!-- LOGIN PAGE -->

<div id="loginPage">

<div class="login-box">

<h2 class="login-title">
Secure Access
</h2>

<input
type="email"
id="email"
class="input"
placeholder="Email"
>

<input
type="password"
id="password"
class="input"
placeholder="Password"
>

<button
class="login-btn"
id="loginBtn"
>
Enter
</button>

</div>

</div>

<!-- CHAT PAGE -->

<div id="chatPage">

<div class="topbar">

<h3>
Private Chat
</h3>

<button
class="logout-btn"
id="logoutBtn"
>
Logout
</button>

</div>

<div
class="messages"
id="messages"
></div>

<div class="input-area">

<input
type="text"
id="messageInput"
class="message-input"
placeholder="Type message..."
>

<button
class="send-btn"
id="sendBtn"
>
Send
</button>

</div>

</div>

<!-- SUPABASE -->

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script>

window.addEventListener(
"load",
function(){

const SUPABASE_URL =
"https://kumqnjqjrtkyfwuvhpqq.supabase.co";

const SUPABASE_KEY =
"PASTE_YOUR_ANON_KEY_HERE";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

/* OPEN LOGIN */

document.getElementById(
"moreBtn"
).onclick=function(){

document.getElementById(
"errorPage"
).style.display="none";

document.getElementById(
"loginPage"
).style.display="flex";

};

/* LOGIN */

document.getElementById(
"loginBtn"
).onclick=async function(){

const email =
document.getElementById(
"email"
).value;

const password =
document.getElementById(
"password"
).value;

const { error } =
await supabaseClient.auth.signInWithPassword({

email,
password

});

if(error){

alert(error.message);

return;

}

document.getElementById(
"loginPage"
).style.display="none";

document.getElementById(
"chatPage"
).style.display="block";

loadMessages();

};

/* LOGOUT */

document.getElementById(
"logoutBtn"
).onclick=async function(){

await supabaseClient.auth.signOut();

location.reload();

};

/* SEND MESSAGE */

document.getElementById(
"sendBtn"
).onclick=sendMessage;

async function sendMessage(){

const input =
document.getElementById(
"messageInput"
);

const text =
input.value.trim();

if(!text) return;

const {
data:{user}
} = await supabaseClient.auth.getUser();

await supabaseClient
.from("message")
.insert([{

sender:user.email,

encrypted:{
text:text
}

}]);

input.value="";

}

/* LOAD MESSAGES */

async function loadMessages(){

const box =
document.getElementById(
"messages"
);

async function refresh(){

const { data } =
await supabaseClient
.from("message")
.select("*")
.order("id",{ascending:true});

box.innerHTML="";

for(const item of data){

const div =
document.createElement(
"div"
);

div.className="message";

div.innerHTML=`

<b>${item.sender}</b>
<br><br>
${item.encrypted.text}

`;

box.appendChild(div);

}

box.scrollTop=
box.scrollHeight;

}

refresh();

supabaseClient
.channel("chat-room")
.on(
"postgres_changes",
{
event:"*",
schema:"public",
table:"message"
},
()=>{
refresh();
}
)
.subscribe();

}

}
);

</script>

</body>
</html>
