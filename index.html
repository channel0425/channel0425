<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Connection Error</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#111111;
    color:white;
    overflow:hidden;
}

#errorPage{
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}

.error-container{
    max-width:600px;
}

.error-code{
    font-size:110px;
    font-weight:bold;
    color:#b0b0b0;
}

.error-title{
    font-size:32px;
    margin-top:10px;
    color:#d1d5db;
}

.error-text{
    margin-top:20px;
    color:#9ca3af;
    line-height:1.7;
    font-size:15px;
}

.more-link{
    margin-top:35px;
    display:inline-block;
    color:#6b7280;
    cursor:pointer;
    font-size:13px;
    transition:0.3s;
}

.more-link:hover{
    color:#d1d5db;
}

#loginPage{
    width:100%;
    height:100vh;
    display:none;
    justify-content:center;
    align-items:center;
    background:#0f172a;
}

.login-box{
    width:350px;
    background:#111827;
    padding:30px;
    border-radius:18px;
    border:1px solid #1e293b;
}

.login-title{
    text-align:center;
    margin-bottom:25px;
}

.input{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border:none;
    outline:none;
    background:#1e293b;
    border-radius:10px;
    color:white;
}

.login-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

#chatPage{
    display:none;
    height:100vh;
    background:#0f172a;
}

.chat-layout{
    display:flex;
    height:100%;
}

.sidebar{
    width:250px;
    background:#111827;
    border-right:1px solid #1e293b;
    padding:25px;
}

.sidebar h2{
    margin-bottom:15px;
}

.sidebar p{
    color:#94a3b8;
    line-height:1.6;
    font-size:14px;
}

.main-chat{
    flex:1;
    display:flex;
    flex-direction:column;
}

.topbar{
    height:70px;
    border-bottom:1px solid #1e293b;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 20px;
}

.logout-btn{
    border:none;
    background:#ef4444;
    color:white;
    padding:10px 15px;
    border-radius:10px;
    cursor:pointer;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.message{
    background:#1e293b;
    padding:12px;
    border-radius:12px;
    margin-bottom:12px;
    max-width:70%;
    line-height:1.5;
}

.me{
    margin-left:auto;
    background:#2563eb;
}

.sender{
    font-size:12px;
    margin-bottom:5px;
    opacity:0.8;
}

.input-area{
    height:80px;
    border-top:1px solid #1e293b;
    display:flex;
    gap:10px;
    padding:15px;
}

.message-input{
    flex:1;
    border:none;
    outline:none;
    background:#1e293b;
    color:white;
    border-radius:12px;
    padding:15px;
}

.send-btn{
    width:100px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

</style>

</head>

<body>

<div id="errorPage">

    <div class="error-container">

        <div class="error-code">
            503
        </div>

        <div class="error-title">
            Service Temporarily Unavailable
        </div>

        <div class="error-text">

            The server is temporarily unable to handle
            your request due to maintenance downtime
            or connection overload.<br><br>

            ERR_CONNECTION_CLOSED

        </div>

        <div class="more-link" onclick="openLogin()">
            More Details
        </div>

    </div>

</div>

<div id="loginPage">

    <div class="login-box">

        <h2 class="login-title">
            Secure Access
        </h2>

        <input
            type="email"
            id="email"
            class="input"
            placeholder="Email"
        >

        <input
            type="password"
            id="password"
            class="input"
            placeholder="Password"
        >

        <input
            type="password"
            id="secret"
            class="input"
            placeholder="Shared Secret Key"
        >

        <button
            class="login-btn"
            onclick="login()"
        >
            Enter
        </button>

    </div>

</div>

<div id="chatPage">

    <div class="chat-layout">

        <div class="sidebar">

            <h2>
                Private Chat
            </h2>

            <p>
                End-to-end encrypted communication.
            </p>

        </div>

        <div class="main-chat">

            <div class="topbar">

                <h3>
                    Secure Conversation
                </h3>

                <button
                    class="logout-btn"
                    onclick="logout()"
                >
                    Logout
                </button>

            </div>

            <div
                class="messages"
                id="messages"
            ></div>

            <div class="input-area">

                <input
                    type="text"
                    id="messageInput"
                    class="message-input"
                    placeholder="Type message..."
                >

                <button
                    class="send-btn"
                    onclick="sendMessage()"
                >
                    Send
                </button>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://kumqnjqjrtkyfwuvhpqq.supabase.co";

const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt1bXFuanFqcnRreWZ3dXZocHFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzODYyMjUsImV4cCI6MjA5Mzk2MjIyNX0.XII_TCL_bFD36XjtWvE3ri3vnCmY5f8f5DU3jc5uQ5U";

const supabase =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

window.sharedSecret = "";

function openLogin(){

    document.getElementById(
        "errorPage"
    ).style.display = "none";

    document.getElementById(
        "loginPage"
    ).style.display = "flex";

}

async function login(){

    const email =
        document.getElementById(
            "email"
        ).value;

    const password =
        document.getElementById(
            "password"
        ).value;

    const secret =
        document.getElementById(
            "secret"
        ).value;

    if(!secret){

        alert("Enter secret key");

        return;
    }

    window.sharedSecret = secret;

    const {
        error
    } = await supabase.auth.signInWithPassword({

        email,
        password

    });

    if(error){

        alert(error.message);

        return;
    }

    location.reload();

}

async function logout(){

    await supabase.auth.signOut();

    location.reload();

}

async function checkUser(){

    const {
        data:{session}
    } = await supabase.auth.getSession();

    if(session){

        document.getElementById(
            "chatPage"
        ).style.display = "block";

        document.getElementById(
            "errorPage"
        ).style.display = "none";

        loadMessages();

    }

}

checkUser();

async function getKey(secret){

    const encoder =
        new TextEncoder();

    const keyMaterial =
        await crypto.subtle.importKey(
            "raw",
            encoder.encode(secret),
            {name:"PBKDF2"},
            false,
            ["deriveKey"]
        );

    return crypto.subtle.deriveKey(

        {
            name:"PBKDF2",
            salt:encoder.encode(
                "secure-chat"
            ),
            iterations:100000,
            hash:"SHA-256"
        },

        keyMaterial,

        {
            name:"AES-GCM",
            length:256
        },

        false,

        ["encrypt","decrypt"]

    );

}

async function encryptMessage(text){

    const key =
        await getKey(
            window.sharedSecret
        );

    const iv =
        crypto.getRandomValues(
            new Uint8Array(12)
        );

    const encoded =
        new TextEncoder()
        .encode(text);

    const encrypted =
        await crypto.subtle.encrypt(

            {
                name:"AES-GCM",
                iv
            },

            key,

            encoded

        );

    return {

        iv:Array.from(iv),

        data:Array.from(
            new Uint8Array(encrypted)
        )

    };

}

async function decryptMessage(obj){

    try{

        const key =
            await getKey(
                window.sharedSecret
            );

        const decrypted =
            await crypto.subtle.decrypt(

                {
                    name:"AES-GCM",
                    iv:new Uint8Array(
                        obj.iv
                    )
                },

                key,

                new Uint8Array(
                    obj.data
                )

            );

        return new TextDecoder()
            .decode(decrypted);

    }catch{

        return "[Unable To Decrypt]";

    }

}

async function sendMessage(){

    const input =
        document.getElementById(
            "messageInput"
        );

    const text =
        input.value.trim();

    if(!text) return;

    const encrypted =
        await encryptMessage(text);

    const {
        data:{user}
    } = await supabase.auth.getUser();

    await supabase
    .from("message")
    .insert([{

        sender:user.email,

        encrypted

    }]);

    input.value = "";

}

async function loadMessages(){

    const box =
        document.getElementById(
            "messages"
        );

    async function refresh(){

        const {
            data
        } = await supabase
        .from("message")
        .select("*")
        .order("id",{ascending:true});

        box.innerHTML = "";

        const {
            data:{user}
        } = await supabase.auth.getUser();

        for(const item of data){

            const text =
                await decryptMessage(
                    item.encrypted
                );

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "message";

            if(
                item.sender === user.email
            ){
                div.classList.add(
                    "me"
                );
            }

            div.innerHTML = `

                <div class="sender">
                    ${item.sender}
                </div>

                ${text}

            `;

            box.appendChild(div);

        }

        box.scrollTop =
            box.scrollHeight;

    }

    refresh();

    supabase
    .channel("message-channel")
    .on(
        "postgres_changes",
        {
            event:"*",
            schema:"public",
            table:"message"
        },
        ()=>{
            refresh();
        }
    )
    .subscribe();

}

document.addEventListener(
    "keydown",

    function(e){

        if(

            e.key === "Enter" &&

            document.getElementById(
                "chatPage"
            ).style.display === "block"

        ){

            sendMessage();

        }

    }

);

</script>

</body>
</html>
