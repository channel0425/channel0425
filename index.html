const supabase = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

document.getElementById(
"moreBtn"
).addEventListener(

function(){

document.getElementById(
"errorPage"

"loginBtn"

async function(){

);

async function sendMessage(){

const input =
document.getElementById(
"messageInput"
);

const text =
input.value.trim();

if(!text) return;

const {
data:{user}
} = await supabase.auth.getUser();

await supabase
.from("message")
.insert([{

sender:user.email,
encrypted:{
text:text
}

}]);

input.value="";

}

async function loadMessages(){

const box =
document.getElementById(
"messages"
);

async function refresh(){

const { data } =
await supabase
.from("message")
.select("*")
.order("id",{ascending:true});

box.innerHTML="";

for(const item of data){

const div =
document.createElement(
"div"
);

div.className="message";

div.innerHTML=`

<div style="font-size:12px;opacity:0.7;margin-bottom:5px;">
${item.sender}
</div>

${item.encrypted.text}

`;

box.appendChild(div);

}

box.scrollTop =
box.scrollHeight;

}

refresh();

supabase
.channel("message-channel")
.on(
"postgres_changes",
{
event:"*",
schema:"public",
table:"message"
},
()=>{
refresh();
}
)
.subscribe();

}

</script>
