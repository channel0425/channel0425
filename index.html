<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Service Temporarily Unavailable</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#0b1120;
color:white;
overflow:hidden;
}

/* ERROR PAGE */

#errorPage{
width:100%;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
background:linear-gradient(
135deg,
#111827,
#0f172a
);
padding:20px;
}

.error-box{
max-width:600px;
}

.error-code{
font-size:120px;
font-weight:bold;
color:#9ca3af;
}

.error-title{
font-size:34px;
margin-top:10px;
color:#f1f5f9;
}

.error-text{
margin-top:20px;
line-height:1.8;
color:#94a3b8;
}

.more-link{
margin-top:35px;
display:inline-block;
font-size:14px;
color:#60a5fa;
cursor:pointer;
}

.more-link:hover{
text-decoration:underline;
}

/* LOGIN PAGE */

#loginPage{
display:none;
width:100%;
height:100vh;
justify-content:center;
align-items:center;
background:linear-gradient(
135deg,
#111827,
#020617
);
}

.login-box{
width:360px;
background:#111827;
padding:35px;
border-radius:20px;
border:1px solid #1e293b;
box-shadow:0 0 40px rgba(0,0,0,0.4);
}

.login-title{
text-align:center;
margin-bottom:25px;
color:#f8fafc;
}

.input{
width:100%;
padding:15px;
margin-bottom:15px;
border:none;
outline:none;
background:#1e293b;
border-radius:12px;
color:white;
font-size:15px;
}

.login-btn{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:linear-gradient(
90deg,
#2563eb,
#06b6d4
);
color:white;
font-weight:bold;
cursor:pointer;
font-size:15px;
}

/* CHAT PAGE */

#chatPage{
display:none;
width:100%;
height:100vh;
background:#0f172a;
}

.topbar{
height:70px;
background:#111827;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
border-bottom:1px solid #1e293b;
}

.topbar h3{
color:#f8fafc;
}

.top-buttons{
display:flex;
gap:10px;
}

.logout-btn,
.clear-btn{
border:none;
padding:10px 15px;
color:white;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

.logout-btn{
background:#ef4444;
}

.clear-btn{
background:#f59e0b;
}

.messages{
height:calc(100vh - 150px);
overflow-y:auto;
padding:20px;
display:flex;
flex-direction:column;
gap:12px;
}

/* MESSAGE */

.message{
padding:14px;
border-radius:18px;
max-width:75%;
line-height:1.6;
word-wrap:break-word;
position:relative;
font-size:15px;
}

.left{
align-self:flex-start;
background:#1e293b;
color:#f8fafc;
border-bottom-left-radius:5px;
}

.right{
align-self:flex-end;
background:linear-gradient(
135deg,
#2563eb,
#06b6d4
);
color:white;
border-bottom-right-radius:5px;
}

.sender{
font-size:12px;
margin-bottom:6px;
opacity:0.7;
}

.chat-image{
max-width:240px;
border-radius:12px;
margin-top:10px;
}

/* INPUT AREA */

.input-area{
height:80px;
display:flex;
gap:10px;
padding:15px;
border-top:1px solid #1e293b;
background:#111827;
}

.message-input{
flex:1;
border:none;
outline:none;
background:#1e293b;
padding:15px;
border-radius:12px;
color:white;
font-size:15px;
}

.send-btn{
width:110px;
border:none;
border-radius:12px;
background:linear-gradient(
90deg,
#2563eb,
#06b6d4
);
color:white;
font-weight:bold;
cursor:pointer;
}

.image-btn{
background:#8b5cf6;
border:none;
padding:0 15px;
border-radius:12px;
color:white;
cursor:pointer;
}

</style>

</head>

<body>

<!-- ERROR PAGE -->

<div id="errorPage">

<div class="error-box">

<div class="error-code">
503
</div>

<div class="error-title">
Service Temporarily Unavailable
</div>

<div class="error-text">

The server is temporarily unable to handle your request.

<br><br>

ERR_CONNECTION_CLOSED

</div>

<div class="more-link" id="moreBtn">
More Details
</div>

</div>

</div>

<!-- LOGIN PAGE -->

<div id="loginPage">

<div class="login-box">

<h2 class="login-title">
Secure Access
</h2>

<input
type="email"
id="email"
class="input"
placeholder="Email"
>

<input
type="password"
id="password"
class="input"
placeholder="Password"
>

<button
class="login-btn"
id="loginBtn"
>
Enter
</button>

</div>

</div>

<!-- CHAT PAGE -->

<div id="chatPage">

<div class="topbar">

<h3>
Private Chat
</h3>

<div class="top-buttons">

<button
class="clear-btn"
id="clearBtn"
>
Clear Chat
</button>

<button
class="logout-btn"
id="logoutBtn"
>
Logout
</button>

</div>

</div>

<div
class="messages"
id="messages"
></div>

<div class="input-area">

<input
type="file"
id="imageInput"
accept="image/*"
style="display:none"
>

<button
class="image-btn"
id="imageBtn"
>
Image
</button>

<input
type="text"
id="messageInput"
class="message-input"
placeholder="Type message..."
>

<button
class="send-btn"
id="sendBtn"
>
Send
</button>

</div>

</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script>

window.addEventListener(
"load",
function(){

/* =========================
SUPABASE CONFIG
========================= */

const SUPABASE_URL =
"https://kumqnjqjrtkyfwuvhpqq.supabase.co";

const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt1bXFuanFqcnRreWZ3dXZocHFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzODYyMjUsImV4cCI6MjA5Mzk2MjIyNX0.XII_TCL_bFD36XjtWvE3ri3vnCmY5f8f5DU3jc5uQ5U";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

/* =========================
OPEN LOGIN
========================= */

document.getElementById(
"moreBtn"
).onclick=function(){

document.getElementById(
"errorPage"
).style.display="none";

document.getElementById(
"loginPage"
).style.display="flex";

};

/* =========================
LOGIN
========================= */

document.getElementById(
"loginBtn"
).onclick=async function(){

const email =
document.getElementById(
"email"
).value;

const password =
document.getElementById(
"password"
).value;

const { error } =
await supabaseClient.auth.signInWithPassword({

email,
password

});

if(error){

alert(error.message);
return;

}

document.getElementById(
"loginPage"
).style.display="none";

document.getElementById(
"chatPage"
).style.display="block";

loadMessages();

};

/* =========================
LOGOUT
========================= */

document.getElementById(
"logoutBtn"
).onclick=async function(){

await supabaseClient.auth.signOut();

location.reload();

};

/* =========================
CLEAR CHAT
========================= */

document.getElementById(
"clearBtn"
).onclick=async function(){

const confirmClear =
confirm(
"Clear all chat messages?"
);

if(!confirmClear) return;

await supabaseClient
.from("message")
.delete()
.neq("id",0);

document.getElementById(
"messages"
).innerHTML="";

};

/* =========================
SEND TEXT MESSAGE
========================= */

document.getElementById(
"sendBtn"
).onclick=sendMessage;

document.getElementById(
"messageInput"
).addEventListener(
"keypress",
function(e){

if(e.key==="Enter"){

sendMessage();

}

}
);

async function sendMessage(){

const input =
document.getElementById(
"messageInput"
);

const text =
input.value.trim();

if(!text) return;

const {
data:{user}
} = await supabaseClient.auth.getUser();

await supabaseClient
.from("message")
.insert([{

sender:user.email,

type:"text",

encrypted:{
text:text
}

}]);

input.value="";

}

/* =========================
IMAGE SEND
========================= */

document.getElementById(
"imageBtn"
).onclick=function(){

document.getElementById(
"imageInput"
).click();

};

document.getElementById(
"imageInput"
).addEventListener(
"change",
async function(){

const file =
this.files[0];

if(!file) return;

const reader =
new FileReader();

reader.onload=async function(){

const {
data:{user}
} = await supabaseClient.auth.getUser();

await supabaseClient
.from("message")
.insert([{

sender:user.email,

type:"image",

encrypted:{
image:reader.result
}

}]);

};

reader.readAsDataURL(file);

}
);

/* =========================
LOAD MESSAGES
========================= */

async function loadMessages(){

const box =
document.getElementById(
"messages"
);

const {
data
} = await supabaseClient
.from("message")
.select("*")
.order("id",{ascending:true});

box.innerHTML="";

for(const item of data){

addMessage(item);

}

/* REALTIME */

supabaseClient
.channel("chat-room")

.on(
"postgres_changes",
{
event:"INSERT",
schema:"public",
table:"message"
},

(payload)=>{

addMessage(
payload.new
);

}

)

.subscribe();

}

/* =========================
ADD MESSAGE
========================= */

async function addMessage(item){

const box =
document.getElementById(
"messages"
);

const div =
document.createElement(
"div"
);

div.classList.add(
"message"
);

const {
data:{user}
} = await supabaseClient.auth.getUser();

if(item.sender===user.email){

div.classList.add(
"right"
);

}else{

div.classList.add(
"left"
);

}

let content="";

if(item.type==="image"){

content=`

<img
src="${item.encrypted.image}"
class="chat-image"
>

`;

}else{

content=item.encrypted.text;

}

div.innerHTML=`

<div class="sender">
${item.sender}
</div>

${content}

`;

box.appendChild(div);

box.scrollTop=
box.scrollHeight;

}

}
);

</script>

</body>

</html>
